name: Civix CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-and-ml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ML dependencies
        run: |
          cd ml_service
          pip install -r requirements.txt

      - name: Run ML Unit Tests & Benchmarks
        run: |
          cd ml_service
          python -m unittest discover tests

      - name: Run ML Golden Evaluation Gate
        run: |
          cd ml_service
          python eval/run_eval.py

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Frontend & Backend Dependencies
        run: |
          npm ci || npm install
          cd backend && (npm ci || npm install)

      - name: Build Frontend
        run: |
          npm run build

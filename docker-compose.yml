version: '3.8'

services:
  # --- MongoDB Database ---
  mongo:
    image: mongo:6.0
    container_name: civix-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # --- Redis Cache & Queue ---
  redis:
    image: redis:7-alpine
    container_name: civix-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # --- FastAPI ML Microservice ---
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: civix-ml
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - redis
    restart: unless-stopped

  # --- Express Backend API ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civix-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/civix
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml_service:8000
    depends_on:
      - mongo
      - redis
      - ml_service
    restart: unless-stopped

  # --- React Frontend ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civix-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
